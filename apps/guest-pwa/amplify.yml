version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9
        - cd ../.. && pnpm install --frozen-lockfile
        - cd ../.. && pnpm --filter @hotel-app/config build
        - cd ../.. && pnpm --filter @hotel-app/core build
    build:
      commands:
        - pnpm next build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
      - node_modules/**/*
      - .next/cache/**/*
