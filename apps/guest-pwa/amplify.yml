version: 1
applications:
  - appRoot: apps/guest-pwa
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm install -g pnpm@9
            - cd ../.. && pnpm install --frozen-lockfile
            - cd ../.. && pnpm --filter @hotel-app/config build
            - cd ../.. && pnpm --filter @hotel-app/core build
        build:
          commands:
            - cd ../.. && pnpm --filter @hotel-app/guest-pwa build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
