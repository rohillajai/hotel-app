# ─── coturn configuration — LOCAL DEVELOPMENT ────────────────────────────────
# Production config is generated by Terraform (infra/terraform/).
# This file is used by Docker Compose for local WebRTC testing only.

# Network
listening-port=3478
listening-ip=0.0.0.0
relay-ip=127.0.0.1
external-ip=127.0.0.1

# Relay port range (must match Docker / security group rules)
min-port=49152
max-port=65535

# Authentication — HMAC time-limited credentials (RFC 5766 §4.3.2)
# The application uses use-auth-secret mode so credentials expire per session.
use-auth-secret
static-auth-secret=localturnsecret

# Realm (must match what the client sends)
realm=turn.localhost

# Security
no-tcp-relay
fingerprint
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging (stdout for Docker)
log-file=stdout
verbose

# Disable unnecessary protocols for WebRTC audio
no-tlsv1
no-tlsv1_1
