###############################################################################
# Production Docker Compose — Single EC2 (15.207.160.237)
# Domain: epbx.negd.in
# Everything runs here: DB, Redis, API, Signaling, coturn, 3 frontends, Caddy
###############################################################################
name: hotel-app-prod

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ─── API Server (NestJS) ────────────────────────────────────────────────────
  api-server:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      PORT: "3001"
    networks:
      - backend

  # ─── Signaling Server (Socket.io) ──────────────────────────────────────────
  signaling-server:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.signaling
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env.prod
    environment:
      REDIS_URL: redis://redis:6379
      API_SERVER_URL: http://api-server:3001
      PORT: "3002"
      NODE_ENV: production
    networks:
      - backend

  # ─── Guest PWA (Next.js) ───────────────────────────────────────────────────
  guest-pwa:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.guest-pwa
      args:
        NEXT_PUBLIC_API_URL: https://api.epbx.negd.in
        NEXT_PUBLIC_SIGNALING_URL: https://signal.epbx.negd.in
    restart: always
    environment:
      PORT: "3000"
    networks:
      - backend

  # ─── Staff PWA (Next.js) ───────────────────────────────────────────────────
  staff-pwa:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.staff-pwa
      args:
        NEXT_PUBLIC_API_URL: https://api.epbx.negd.in
        NEXT_PUBLIC_SIGNALING_URL: https://signal.epbx.negd.in
    restart: always
    environment:
      PORT: "3003"
    networks:
      - backend

  # ─── Admin Web (Next.js) ───────────────────────────────────────────────────
  admin-web:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.admin-web
      args:
        NEXT_PUBLIC_API_URL: https://api.epbx.negd.in
    restart: always
    environment:
      PORT: "3004"
    networks:
      - backend

  # ─── coturn (STUN/TURN) ────────────────────────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    restart: always
    network_mode: host
    volumes:
      - ./coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf --static-auth-secret=${COTURN_SECRET} --external-ip=15.207.160.237

  # ─── Caddy (reverse proxy + auto Let's Encrypt HTTPS) ──────────────────────
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-server
      - signaling-server
      - guest-pwa
      - staff-pwa
      - admin-web
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
