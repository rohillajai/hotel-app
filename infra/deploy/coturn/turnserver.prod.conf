# coturn production config — Hotel App
# This file is mounted into the coturn container

listening-port=3478
listening-ip=0.0.0.0
# external-ip is set dynamically by the setup script (or use EC2 public IP)
# external-ip=<PUBLIC_IP>/<PRIVATE_IP>

min-port=49152
max-port=65535

# HMAC time-limited credentials
use-auth-secret
# static-auth-secret is set via TURN_SECRET env var or replace below
static-auth-secret=REPLACE_WITH_COTURN_SECRET

realm=turn.epbx.negd.in

# Security
fingerprint
no-tcp-relay
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

no-tlsv1
no-tlsv1_1

# Logging
log-file=stdout
simple-log
